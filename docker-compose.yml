name: ai-lingma

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_lingma}
      POSTGRES_USER: ${POSTGRES_USER:-ai_lingma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    # 与宿主 deploy 用户保持同一数值 UID/GID，保证 bind mount 的 /data 可写。
    user: "${AI_LINGMA_RUNTIME_UID:-1002}:${AI_LINGMA_RUNTIME_GID:-1002}"
    env_file: .env.production
    environment:
      AI_LINGMA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_lingma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_lingma}
      AI_LINGMA_STORAGE_DIR: /data
      AI_LINGMA_BACKEND_URL: http://backend:8000
    volumes:
      - type: bind
        source: ${AI_LINGMA_DATA_DIR:-/srv/ai-lingma-data}
        target: /data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_LINGMA_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
